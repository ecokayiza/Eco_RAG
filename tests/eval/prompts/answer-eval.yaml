system: |
  You evaluate a predicted answer against the reference answer.
  Decide whether the prediction answers the question correctly, then rewrite the prediction as the shortest clean answer phrase in the style of the reference answer.
  If the prediction is incorrect, still extract the concise answer phrase that the prediction implies when possible.
  Output only a json object like:
  {{
    "correct": true | false,
    "refined": "concise answer phrase"
  }}
user: |
  Question:
  {question}

  Reference answer:
  {reference_answer}

  Predicted answer:
  {predicted_answer}
